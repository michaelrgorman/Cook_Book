<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cook This!</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cook This!">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --yellow:#FFC93C;
    --pink:#FF4D8D;
    --blue:#3A7BFF;
    --green:#33B27A;
    --orange:#FF7A33;
    --purple:#8C6BF2;
    --ink:#161616;
    --cream:#FFF6E9;
    --card:#FFFFFF;
    --text:#161616;
    --muted:#777777;
    --line:3px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--cream);
    color: var(--text);
    font-family:'Fredoka', sans-serif;
    padding-bottom: 84px;
    min-height:100vh;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mono{ font-family:'Space Mono', monospace; }
  h1,h2,h3{ font-family:'Fredoka', sans-serif; margin:0; }
  button{ font-family:'Fredoka', sans-serif; }

  /* ---------- Dark mode ---------- */
  body.dark{
    --cream:#17171B;
    --card:#232329;
    --text:#F3EFE4;
    --muted:#9C9C9C;
  }
  body.dark .cooked-entry{ background:#1B1B20; }
  body.dark .card-body{ border-top-color:#33333a; }
  body.dark .field input, body.dark .field select, body.dark .field textarea{ background:#fff; color:#161616; }
  body.dark .book-tile.add-tile{ color: var(--text); }
  body.dark .page-pill.none{ background:#444; color:#ddd; }

  .hardline{ border: var(--line) solid var(--ink); }
  .pop{ box-shadow: 5px 5px 0 var(--ink); }
  .pop-sm{ box-shadow: 3px 3px 0 var(--ink); }
  .pressable{ transition: transform 0.08s ease, box-shadow 0.08s ease; cursor:pointer; }
  .pressable:active{ transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--ink) !important; }

  /* ---------- Top bar ---------- */
  .topbar{
    background: var(--ink);
    color: var(--cream);
    padding: 16px 18px 20px;
    border-bottom: var(--line) solid var(--ink);
    position: sticky; top:0; z-index: 30;
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo .blob{
    width:38px; height:38px; border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
    background: var(--yellow); border: 2.5px solid var(--cream);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .logo h1{ font-size: 22px; font-weight:700; letter-spacing:-0.01em; color: #FFF6E9; }
  .topbar-actions{ display:flex; gap:8px; flex-shrink:0; }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border: 2.5px solid var(--cream); color:#FFF6E9;
    font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background: var(--pink);
  }
  .icon-btn.theme{ background: var(--blue); }
  .search-bar{ display:none; margin-top:14px; }
  .search-bar.open{ display:block; }
  .search-bar input{
    width:100%; padding: 12px 14px; border-radius: 14px; border: 2.5px solid #FFF6E9;
    background: #0c0c0c; color: #FFF6E9; font-family:'Space Mono', monospace; font-size:13px;
  }
  .search-bar input::placeholder{ color: #b9b9b9; }

  /* ---------- Page container ---------- */
  .page{ display:none; padding: 18px 16px 20px; max-width: 720px; margin: 0 auto; }
  .page.active{ display:block; }

  .section-title{ font-size: 20px; font-weight:700; margin: 22px 0 12px; }
  .section-title:first-child{ margin-top:0; }

  /* ---------- Stat cards ---------- */
  .stats-row{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
  .stat-card{
    background: var(--card); border-radius:16px; padding: 14px 10px; text-align:center;
  }
  .stat-card .num{ font-size: 26px; font-weight:700; line-height:1; }
  .stat-card .label{ font-family:'Space Mono', monospace; font-size:10px; margin-top:6px; color:#444; text-transform:lowercase; }
  .stat-card.c1{ background: var(--yellow); color:#161616; }
  .stat-card.c1 .label{ color:#4a3a08; }
  .stat-card.c2{ background: var(--pink); color:#fff; }
  .stat-card.c2 .label{ color:#ffe1ec; }
  .stat-card.c3{ background: var(--blue); color:#fff; }
  .stat-card.c3 .label{ color:#dbe8ff; }
  .stat-card.plain .label{ color: var(--muted); }

  /* ---------- Tonight card ---------- */
  .tonight-card{
    background: var(--purple); color:#fff; border-radius:20px; padding:20px; margin-top:16px;
  }
  .tonight-card .eyebrow{ font-family:'Space Mono', monospace; font-size:11px; opacity:0.85; }
  .tonight-card .dish{ font-size: 24px; font-weight:700; margin: 8px 0 4px; }
  .tonight-card .from{ font-family:'Space Mono', monospace; font-size:12px; opacity:0.9; margin-bottom:14px; }
  .tonight-empty{ font-size:15px; opacity:0.9; margin-bottom: 6px;}

  .btn{
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:14px;
    padding: 11px 18px; border-radius: 30px; border: var(--line) solid var(--ink);
    background: var(--card); color: var(--text); display:inline-flex; align-items:center; gap:6px;
  }
  .btn.on-dark{ border-color:#fff; background: rgba(255,255,255,0.14); color:#fff; }
  .btn.yellow{ background: var(--yellow); color:#161616; }
  .btn.pink{ background: var(--pink); color:#fff; border-color: var(--ink); }
  .btn.green{ background: var(--green); color:#fff; }
  .btn.block{ width:100%; justify-content:center; }
  .btn.small{ padding: 7px 12px; font-size:12.5px; }
  .btn.danger{ background:#fff; color:#D8425A; border-color:#D8425A; }

  /* ---------- Pill row (sort / tabs / tags) ---------- */
  .pill-row{ display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; -webkit-overflow-scrolling: touch; }
  .pill-row::-webkit-scrollbar{ display:none; }
  .pill-btn{
    flex-shrink:0; font-family:'Space Mono', monospace; font-size:11px; font-weight:700;
    padding:8px 13px; border-radius:20px; border:2px solid var(--ink); background: var(--card); color: var(--text);
    white-space:nowrap;
  }
  .pill-btn.active{ background: var(--ink); color: var(--cream); }
  .pill-btn.on-dark{ border-color:#fff; background: rgba(255,255,255,0.14); color:#fff; }
  .pill-btn.on-dark.active{ background:#fff; color: var(--purple); }

  /* ---------- Recently cooked / generic list items ---------- */
  .recent-item{
    background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .recent-item .name{ font-weight:600; font-size:15px; }
  .recent-item .sub{ font-family:'Space Mono', monospace; font-size:11px; color: var(--muted); margin-top:2px; }
  .rating-chip{
    background: var(--yellow); border-radius:20px; min-width:44px; height:32px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-family:'Space Mono', monospace; font-weight:700; font-size:12px;
    border: 2px solid var(--ink); padding: 0 8px; white-space:nowrap; color:#161616;
  }
  .empty-msg{
    font-family:'Space Mono', monospace; font-size:12.5px; color: var(--muted); text-align:center; padding: 24px 10px;
    background: var(--card); border-radius:16px;
  }

  /* ---------- Book grid (Books tab) ---------- */
  .book-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:12px; margin-bottom: 6px; }
  .book-tile{
    border-radius:18px; padding:16px; min-height:118px; color:#fff;
    border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .book-tile-title{ font-weight:700; font-size:15px; line-height:1.25; }
  .book-tile-sub{ font-family:'Space Mono', monospace; font-size:10px; opacity:0.9; margin-top:4px; }
  .book-tile-count{
    font-family:'Space Mono', monospace; font-size:10px; margin-top:10px; align-self:flex-start;
    background: rgba(0,0,0,0.22); padding:3px 9px; border-radius:10px;
  }
  .book-tile.add-tile{
    background: var(--card); color: var(--text); align-items:center; justify-content:center;
    text-align:center; font-weight:600; font-size:14px; border-style:dashed; box-shadow:none;
  }
  .back-btn{ margin-bottom:12px; }
  .card-tags{ font-family:'Space Mono', monospace; font-size:10.5px; color: var(--muted); margin-top:3px; }

  .fab-row{ display:flex; gap:8px; margin-bottom:14px; }

  /* ---------- Recipe cards ---------- */
  .cards{ display:flex; flex-direction:column; gap:10px; }
  .card{ background: var(--card); border-radius:18px; padding: 14px 16px; }
  .card-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; }
  .card-title .name{ font-weight:600; font-size:16px; }
  .card-title .book-tag{ display:block; font-family:'Space Mono', monospace; font-size:11px; color: var(--muted); margin-top:2px; }
  .card-right{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .fav-btn{ background:none; border:none; font-size:19px; padding:2px; cursor:pointer; line-height:1; flex-shrink:0; }
  .page-pill{
    font-family:'Space Mono', monospace; font-size:11.5px; background: var(--green); color:#fff;
    padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .page-pill.none{ background:#ccc; color:#555; }
  .chevron{ font-size:18px; transition: transform 0.15s ease; color: var(--muted); }
  .card.expanded .chevron{ transform: rotate(90deg); }
  .card-body{ display:none; margin-top:12px; padding-top:12px; border-top: 2px dashed #eee; }
  .card.expanded .card-body{ display:block; }

  .cooked-log{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .cooked-entry{
    display:flex; justify-content:space-between; gap:10px; background: var(--cream);
    padding: 9px 12px; border-radius:12px;
  }
  .cooked-entry .left{ font-size:13px; }
  .cooked-entry .date{ font-family:'Space Mono', monospace; font-size:10.5px; color: var(--muted); display:block; }
  .no-log{ font-family:'Space Mono', monospace; font-size:12px; color: var(--muted); margin-bottom:10px; }

  .inline-form{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .inline-form input{
    font-family:'Space Mono', monospace; font-size:12.5px; padding:9px 10px;
    border-radius:10px; border: 2px solid #e5e0d3; background:#fff; color:#161616;
  }
  .again-toggle{ display:flex; gap:6px; }
  .again-btn{
    font-family:'Space Mono', monospace; font-size:11.5px; font-weight:700; padding:8px 12px;
    border-radius:20px; border: 2px solid #e5e0d3; background:#fff; color:#999;
  }
  .again-btn.yes.on{ background: var(--green); border-color: var(--ink); color:#fff; }
  .again-btn.no.on{ background:#D8425A; border-color: var(--ink); color:#fff; }
  .again-badge{
    font-family:'Space Mono', monospace; font-size:10.5px; font-weight:700; padding:3px 9px;
    border-radius:12px; white-space:nowrap;
  }
  .again-badge.yes{ background: var(--green); color:#fff; }
  .again-badge.no{ background:#D8425A; color:#fff; }
  .row-actions{ display:flex; gap:8px; }

  /* ---------- Cooked tab ---------- */
  .cooked-full-item{
    background: var(--card); border-radius:16px; padding:14px 16px; margin-bottom:10px;
  }
  .cooked-full-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .cooked-full-top .name{ font-weight:600; font-size:15.5px; }
  .cooked-full-top .book{ font-family:'Space Mono', monospace; font-size:11px; color: var(--muted); }
  .cooked-full-comment{ font-size:14px; margin-top:8px; color: var(--text); }
  .cooked-full-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .cooked-full-bottom .date{ font-family:'Space Mono', monospace; font-size:11px; color: var(--muted); }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; bottom:0; left:0; right:0; background: var(--ink);
    border-top: var(--line) solid var(--ink); display:flex; z-index:40;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .navbtn{
    flex:1; background:none; border:none; color:#8b8b8b; padding: 11px 4px 9px;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600;
  }
  .navbtn .icon{ font-size:19px; }
  .navbtn.active{ color: var(--yellow); }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background: rgba(22,22,22,0.6); display:none; align-items:flex-end; justify-content:center; z-index:60; }
  .overlay.open{ display:flex; }
  .modal{
    background: var(--cream); border-radius: 24px 24px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    width:100%; max-width: 480px; max-height: 86vh; overflow-y:auto;
    border-top: var(--line) solid var(--ink); color: var(--text);
  }
  @media (min-width: 540px){
    .overlay{ align-items:center; }
    .modal{ border-radius:24px; border: var(--line) solid var(--ink); }
  }
  .modal-handle{ width:40px; height:5px; background:#ddd; border-radius:10px; margin: 0 auto 14px; }
  .modal h3{ font-size:20px; font-weight:700; margin-bottom:16px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:'Space Mono', monospace; font-size:10.5px; color: var(--muted); margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border-radius:12px; border: 2.5px solid var(--ink);
    font-family:'Fredoka', sans-serif; font-size:15px; background:#fff; color: #161616;
  }
  .field.checkrow{ display:flex; align-items:center; gap:8px; }
  .field.checkrow input{ width:auto; }
  .field.checkrow label{ margin:0; font-size:13px; color: var(--text); font-family:'Fredoka', sans-serif; }
  .field textarea{ min-height:70px; resize:vertical; }
  .modal-actions{ display:flex; gap:8px; margin-top:18px; }
  .modal-actions .btn{ flex:1; }

  .toast{
    position:fixed; bottom: 94px; left:50%; transform:translateX(-50%);
    background: var(--ink); color:#fff; font-family:'Space Mono', monospace; font-size:12.5px;
    padding:12px 18px; border-radius:14px; z-index:100; max-width:90vw; text-align:center;
  }
  .toast.error{ background:#D8425A; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="logo">
      <div class="blob">🍝</div>
      <h1>Cook This!</h1>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn theme" id="themeToggle" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" onclick="toggleSearch()">🔍</button>
    </div>
  </div>
  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="find a recipe, page, or tag...">
  </div>
</div>

<!-- DASHBOARD -->
<div class="page active" id="page-dashboard">
  <div class="stats-row">
    <div class="stat-card c1"><div class="num" id="statBooks">0</div><div class="label">cookbooks</div></div>
    <div class="stat-card c2"><div class="num" id="statRecipes">0</div><div class="label">recipes</div></div>
    <div class="stat-card c3"><div class="num" id="statAvg">–</div><div class="label">avg rating</div></div>
  </div>

  <div class="tonight-card" id="tonightCard">
    <div class="eyebrow">// what should i cook tonight?</div>
    <div class="pill-row on-dark" id="tonightTagRow" style="margin-top:12px;"></div>
    <div id="tonightBody"><div class="tonight-empty">Add a few recipes first!</div></div>
    <button class="btn on-dark" onclick="rollTonight()">🎲 Roll again</button>
  </div>

  <div class="section-title">Recently cooked</div>
  <div id="recentList"></div>
</div>

<!-- BOOKS -->
<div class="page" id="page-books">
  <div id="booksGridWrap">
    <div class="pill-row" id="shelfViewTabs"></div>
    <div class="book-grid" id="bookGrid"></div>
  </div>

  <div id="booksDetailWrap" style="display:none;">
    <div id="booksMainHead"></div>
    <div class="fab-row">
      <button class="btn pink small pop-sm pressable" onclick="openRecipeModal()">+ Recipe</button>
    </div>
    <div class="pill-row" id="sortRow"></div>
    <div class="cards" id="cardsWrap"></div>
    <div class="empty-msg" id="emptyState" style="display:none;">nothing here yet — add a recipe!</div>
  </div>
</div>

<!-- COOKED -->
<div class="page" id="page-cooked">
  <div class="section-title" style="margin-top:0; display:flex; justify-content:space-between; align-items:center;">
    <span>Cooked log</span>
    <button class="btn pink small pop-sm pressable" onclick="openCookedModal()">+ Log a cook</button>
  </div>
  <div id="cookedFullList"></div>
  <div class="empty-msg" id="cookedEmpty" style="display:none;">no meals logged yet — go cook something!</div>
</div>

<!-- STATS -->
<div class="page" id="page-stats">
  <div class="section-title" style="margin-top:0;">The numbers</div>
  <div id="statsBody"></div>
</div>

<div class="bottomnav">
  <button class="navbtn active" id="nav-dashboard" onclick="switchTab('dashboard')"><span class="icon">🏠</span>Home</button>
  <button class="navbtn" id="nav-books" onclick="switchTab('books')"><span class="icon">📚</span>Books</button>
  <button class="navbtn" id="nav-cooked" onclick="switchTab('cooked')"><span class="icon">🍳</span>Cooked</button>
  <button class="navbtn" id="nav-stats" onclick="switchTab('stats')"><span class="icon">📊</span>Stats</button>
</div>

<!-- Book Modal -->
<div class="overlay" id="bookOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="bookModalTitle">Add a cookbook</h3>
    <input type="hidden" id="bookOriginalISBN">
    <div class="field"><label>isbn</label><input type="text" id="bookISBN" placeholder="9780091943745"></div>
    <div class="field"><label>title</label><input type="text" id="bookTitle"></div>
    <div class="field"><label>author</label><input type="text" id="bookAuthor"></div>
    <div class="field"><label>location</label><input type="text" id="bookLocation" placeholder="e.g. kitchen shelf"></div>
    <div class="field checkrow">
      <input type="checkbox" id="bookWishlist">
      <label for="bookWishlist">on my wishlist (don't own it yet)</label>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('bookOverlay')">Cancel</button>
      <button class="btn pink" onclick="saveBook()">Save</button>
    </div>
  </div>
</div>

<!-- Recipe Modal -->
<div class="overlay" id="recipeOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="recipeModalTitle">Add a recipe</h3>
    <input type="hidden" id="recipeOriginalID">
    <div class="field"><label>recipe name</label><input type="text" id="recipeName"></div>
    <div class="field"><label>cookbook</label><select id="recipeBook"></select></div>
    <div class="field"><label>page</label><input type="text" id="recipePage" placeholder="e.g. 42"></div>
    <div class="field"><label>tags / keywords (comma separated)</label><input type="text" id="recipeTags" placeholder="e.g. pasta, quick, spicy"></div>
    <div class="field checkrow">
      <input type="checkbox" id="recipeFavorite">
      <label for="recipeFavorite">⭐ mark as a favorite</label>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('recipeOverlay')">Cancel</button>
      <button class="btn pink" onclick="saveRecipe()">Save</button>
    </div>
  </div>
</div>

<!-- Cooked Modal (standalone log entry) -->
<div class="overlay" id="cookedOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="cookedModalTitle">Log a cook</h3>
    <input type="hidden" id="cookedOriginalID">
    <div class="field"><label>recipe</label><select id="cookedRecipeSelect"></select></div>
    <div class="field"><label>date cooked</label><input type="date" id="cookedDate" min="2026-01-01"></div>
    <div class="field"><label>rating (0–10)</label><input type="number" step="0.1" min="0" max="10" id="cookedRating"></div>
    <div class="field"><label>comments</label><textarea id="cookedComments"></textarea></div>
    <div class="field">
      <label>cook this again?</label>
      <div class="again-toggle" id="cookedAgainToggle">
        <button type="button" class="again-btn yes" onclick="setAgainToggle('cookedAgainToggle', true)">👍 Yes</button>
        <button type="button" class="again-btn no" onclick="setAgainToggle('cookedAgainToggle', false)">👎 No</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('cookedOverlay')">Cancel</button>
      <button class="btn green" onclick="saveStandaloneCooked()">Save</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://eyysxvdemncgigmknjgu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_3rPtZJJRv7iJ-snpGn6oew_94G9c8J3';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const T_BOOK = 'CookBook_Name';
  const T_RECIPE = 'CookBook_Recipe';
  const T_COOKED = 'CookBook_Cooked';

  const PALETTE = ['#FFC93C','#FF4D8D','#3A7BFF','#33B27A','#FF7A33','#8C6BF2'];
  const MIN_DATE = '2026-01-01';

  let books = [];
  let recipes = [];
  let cookedByRecipe = {};
  let cookedAll = [];
  let currentTab = 'dashboard';
  let currentISBN = 'all';       // 'all' = grid view, 'ALL' = flat all-recipes, 'FAV' = favorites, or an ISBN
  let searchTerm = '';
  let expandedRecipe = null;
  let sortMode = 'name';         // name | rating | cooked | newest
  let shelfView = 'owned';       // owned | wishlist
  let tonightPick = null;
  let tonightTagFilter = null;
  const againState = {};

  function isTrue(v){ return v === true || v === 'true' || v === 't'; }
  function isFalseSet(v){ return v === false || v === 'false' || v === 'f'; }

  function toast(msg, isError){
    const t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=> t.remove(), 3800);
  }

  function toggleTheme(){
    document.body.classList.toggle('dark');
    document.getElementById('themeToggle').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  }
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    document.body.classList.add('dark');
  }

  function toggleSearch(){
    document.getElementById('searchBar').classList.toggle('open');
    if(currentTab !== 'books') switchTab('books');
    document.getElementById('searchInput').focus();
  }

  function switchTab(tab){
    currentTab = tab;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-'+tab).classList.add('active');
    document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
    document.getElementById('nav-'+tab).classList.add('active');
    if(tab === 'dashboard') renderDashboard();
    if(tab === 'books') renderBooksTab();
    if(tab === 'cooked') renderCookedTab();
    if(tab === 'stats') renderStats();
  }

  async function loadAll(){
    const [{data:b, error:eb}, {data:r, error:er}, {data:c, error:ec}] = await Promise.all([
      sb.from(T_BOOK).select('*').order('Title', {ascending:true}),
      sb.from(T_RECIPE).select('*').order('RecipeName', {ascending:true}),
      sb.from(T_COOKED).select('*')
    ]);
    if(eb || er || ec){
      console.error(eb, er, ec);
      toast('Could not load data — check RLS policies on your Supabase tables.', true);
      return;
    }
    books = b || [];
    recipes = r || [];
    cookedAll = (c || []).slice().sort((a,z) => String(z.DateCooked).localeCompare(String(a.DateCooked)));
    cookedByRecipe = {};
    cookedAll.forEach(entry => {
      if(!cookedByRecipe[entry.RecipeID]) cookedByRecipe[entry.RecipeID] = [];
      cookedByRecipe[entry.RecipeID].push(entry);
    });
    switchTab(currentTab);
  }

  function bookById(isbn){ return books.find(b => String(b.ISBN) === String(isbn)); }
  function recipeById(id){ return recipes.find(r => String(r.RecipeID) === String(id)); }
  function bookColor(isbn){
    const idx = books.findIndex(b => String(b.ISBN) === String(isbn));
    return PALETTE[(idx < 0 ? 0 : idx) % PALETTE.length];
  }
  function ratingAvg(list){
    const withRatings = list.filter(c => c.Rating !== null && c.Rating !== undefined);
    if(withRatings.length === 0) return null;
    return withRatings.reduce((s,c)=>s+(Number(c.Rating)||0),0) / withRatings.length;
  }
  function allTags(){
    const set = new Set();
    recipes.forEach(r => (r.Tags||'').split(',').forEach(t => { const tt=t.trim(); if(tt) set.add(tt); }));
    return Array.from(set).sort((a,b)=>a.localeCompare(b));
  }

  // ---------------- DASHBOARD ----------------
  function renderDashboard(){
    document.getElementById('statBooks').textContent = books.filter(b=>!isTrue(b.Wishlist)).length;
    document.getElementById('statRecipes').textContent = recipes.length;
    const avg = ratingAvg(cookedAll);
    document.getElementById('statAvg').textContent = avg !== null ? avg.toFixed(1) : '–';

    renderTonight();

    const recentWrap = document.getElementById('recentList');
    if(cookedAll.length === 0){
      recentWrap.innerHTML = `<div class="empty-msg">nothing logged yet — cook something and add it!</div>`;
    } else {
      recentWrap.innerHTML = cookedAll.slice(0,5).map(c => {
        const recipe = recipeById(c.RecipeID);
        const book = recipe ? bookById(recipe.ISBN) : null;
        return `
          <div class="recent-item">
            <div>
              <div class="name">${escapeHtml(recipe ? recipe.RecipeName : 'Unknown recipe')}</div>
              <div class="sub">${escapeHtml(book ? book.Title : '')} · ${escapeHtml(c.DateCooked || '')} ${againBadgeHtml(c.CookAgain)}</div>
            </div>
            <div class="rating-chip">${formatRating(c.Rating)}</div>
          </div>
        `;
      }).join('');
    }
  }

  function getTonightPool(){
    if(!tonightTagFilter) return recipes;
    const f = tonightTagFilter.toLowerCase();
    return recipes.filter(r => (r.Tags||'').toLowerCase().split(',').map(t=>t.trim()).includes(f));
  }

  function renderTonight(){
    const tagRow = document.getElementById('tonightTagRow');
    const tags = allTags();
    if(tags.length === 0){
      tagRow.innerHTML = '';
    } else {
      tagRow.innerHTML = `<button class="pill-btn on-dark ${!tonightTagFilter?'active':''}" onclick="setTonightTag(null)">All</button>` +
        tags.map(t => `<button class="pill-btn on-dark ${tonightTagFilter===t?'active':''}" onclick="setTonightTag('${escapeHtml(t)}')">${escapeHtml(t)}</button>`).join('');
    }

    const body = document.getElementById('tonightBody');
    const pool = getTonightPool();
    if(pool.length === 0){
      body.innerHTML = `<div class="tonight-empty">${recipes.length===0 ? 'Add a few recipes first!' : 'No recipes with that tag yet.'}</div>`;
      return;
    }
    if(!tonightPick || !pool.some(r => r.RecipeID === tonightPick.RecipeID)){
      tonightPick = pool[Math.floor(Math.random()*pool.length)];
    }
    const book = bookById(tonightPick.ISBN);
    body.innerHTML = `
      <div class="dish">${escapeHtml(tonightPick.RecipeName)}</div>
      <div class="from">${escapeHtml(book ? book.Title : '')}${tonightPick.Page ? ' · p.'+escapeHtml(String(tonightPick.Page)) : ''}</div>
    `;
  }
  function setTonightTag(tag){ tonightTagFilter = tag; tonightPick = null; renderTonight(); }
  function rollTonight(){
    const pool = getTonightPool();
    if(pool.length === 0) return;
    let pick;
    do{ pick = pool[Math.floor(Math.random()*pool.length)]; }
    while(pool.length > 1 && tonightPick && pick.RecipeID === tonightPick.RecipeID);
    tonightPick = pick;
    renderTonight();
  }

  // ---------------- BOOKS TAB ----------------
  function renderBooksTab(){
    const showGrid = !searchTerm.trim() && currentISBN === 'all';
    document.getElementById('booksGridWrap').style.display = showGrid ? 'block' : 'none';
    document.getElementById('booksDetailWrap').style.display = showGrid ? 'none' : 'block';

    if(showGrid){
      renderShelfTabs();
      renderBookGrid();
      return;
    }

    const head = document.getElementById('booksMainHead');
    if(searchTerm.trim()){
      head.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h2 style="font-size:19px;">Search results</h2>
          <button class="btn small" onclick="clearSearch()">✕ clear</button>
        </div>
      `;
    } else {
      const book = bookById(currentISBN);
      let titleText = null;
      if(currentISBN === 'ALL') titleText = '🍽 All recipes';
      else if(currentISBN === 'FAV') titleText = '⭐ Favorites';
      else if(book) titleText = book.Title;

      head.innerHTML = `
        <button class="btn small back-btn" onclick="selectBook('all')">‹ All books</button>
        ${titleText ? `
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
            <div>
              <h2 style="font-size:20px;">${escapeHtml(titleText)}</h2>
              ${book ? `<div class="mono" style="font-size:11.5px; color:var(--muted); margin-top:2px;">${escapeHtml(book.Author||'')}${book.Location ? ' · '+escapeHtml(book.Location) : ''}</div>` : ''}
            </div>
            ${book ? `
              <div style="display:flex; gap:6px; flex-shrink:0;">
                <button class="btn small" onclick="openBookModal('${book.ISBN}')">Edit</button>
                <button class="btn small danger" onclick="deleteBook('${book.ISBN}')">Delete</button>
              </div>
            ` : ''}
          </div>
        ` : ''}
      `;
    }

    let list = recipes.slice();
    if(!searchTerm.trim()){
      if(currentISBN === 'FAV') list = list.filter(r => isTrue(r.IsFavorite));
      else if(currentISBN !== 'ALL') list = list.filter(r => String(r.ISBN) === String(currentISBN));
    } else {
      const q = searchTerm.trim().toLowerCase();
      list = list.filter(r =>
        (r.RecipeName||'').toLowerCase().includes(q) ||
        String(r.Page||'').toLowerCase().includes(q) ||
        (r.Tags||'').toLowerCase().includes(q)
      );
    }

    // sort
    if(sortMode === 'name'){
      list.sort((a,b) => (a.RecipeName||'').localeCompare(b.RecipeName||''));
    } else if(sortMode === 'rating'){
      const avg = r => { const v = ratingAvg(cookedByRecipe[r.RecipeID]||[]); return v === null ? -1 : v; };
      list.sort((a,b) => avg(b) - avg(a));
    } else if(sortMode === 'cooked'){
      const cnt = r => (cookedByRecipe[r.RecipeID]||[]).length;
      list.sort((a,b) => cnt(b) - cnt(a));
    } else if(sortMode === 'newest'){
      list.sort((a,b) => Number(b.RecipeID) - Number(a.RecipeID));
    }

    document.getElementById('sortRow').innerHTML = [
      {id:'name', label:'A–Z'},
      {id:'rating', label:'⭐ Top rated'},
      {id:'cooked', label:'🔥 Most cooked'},
      {id:'newest', label:'🆕 Newest'}
    ].map(o => `<button class="pill-btn ${sortMode===o.id?'active':''}" onclick="setSortMode('${o.id}')">${o.label}</button>`).join('');

    const wrap = document.getElementById('cardsWrap');
    const empty = document.getElementById('emptyState');
    wrap.innerHTML = '';
    if(list.length === 0){ empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    const showBookTag = !!searchTerm.trim() || currentISBN === 'ALL' || currentISBN === 'FAV';
    list.forEach(recipe => {
      const book = bookById(recipe.ISBN);
      const cooked = cookedByRecipe[recipe.RecipeID] || [];
      const avg = ratingAvg(cooked);
      const pageLabel = recipe.Page ? `p. ${escapeHtml(String(recipe.Page))}` : 'no page';

      const card = document.createElement('div');
      card.className = 'card' + (expandedRecipe === recipe.RecipeID ? ' expanded' : '');
      card.innerHTML = `
        <div class="card-row" onclick="toggleExpand(${recipe.RecipeID})">
          <div class="card-title">
            <span class="name">${escapeHtml(recipe.RecipeName || '(untitled)')}</span>
            ${showBookTag && book ? `<span class="book-tag">${escapeHtml(book.Title)}</span>` : ''}
            ${recipe.Tags ? `<div class="card-tags">${escapeHtml(recipe.Tags)}</div>` : ''}
          </div>
          <div class="card-right">
            ${cooked.length ? `<span class="mono" style="font-size:11px; color:var(--muted);">🔥${cooked.length}${avg!==null? ' · '+avg.toFixed(1)+'/10':''}</span>` : ''}
            <button class="fav-btn" onclick="toggleFavorite(event, ${recipe.RecipeID})">${isTrue(recipe.IsFavorite) ? '⭐' : '☆'}</button>
            <span class="page-pill ${recipe.Page ? '' : 'none'}">${pageLabel}</span>
            <span class="chevron">›</span>
          </div>
        </div>
        <div class="card-body" id="body-${recipe.RecipeID}"></div>
      `;
      wrap.appendChild(card);
      if(expandedRecipe === recipe.RecipeID) renderCardBody(recipe.RecipeID);
    });
  }

  function setSortMode(mode){ sortMode = mode; renderBooksTab(); }

  function renderShelfTabs(){
    document.getElementById('shelfViewTabs').innerHTML = `
      <button class="pill-btn ${shelfView==='owned'?'active':''}" onclick="setShelfView('owned')">📚 My shelf</button>
      <button class="pill-btn ${shelfView==='wishlist'?'active':''}" onclick="setShelfView('wishlist')">🛒 Wishlist</button>
    `;
  }
  function setShelfView(v){ shelfView = v; renderBookGrid(); }

  function renderBookGrid(){
    const wrap = document.getElementById('bookGrid');
    if(shelfView === 'owned'){
      const owned = books.filter(b => !isTrue(b.Wishlist));
      const favCount = recipes.filter(r => isTrue(r.IsFavorite)).length;
      let html = `
        <div class="book-tile pressable" style="background:#161616;" onclick="selectBook('ALL')">
          <div><div class="book-tile-title">🍽 All recipes</div><div class="book-tile-sub">everything, unsorted</div></div>
          <div class="book-tile-count">${recipes.length} total</div>
        </div>
        <div class="book-tile pressable" style="background:${PALETTE[0]}; color:#161616;" onclick="selectBook('FAV')">
          <div><div class="book-tile-title" style="color:#161616;">⭐ Favorites</div><div class="book-tile-sub" style="color:#161616; opacity:0.75;">your go-tos</div></div>
          <div class="book-tile-count" style="background:rgba(0,0,0,0.12); color:#161616;">${favCount} starred</div>
        </div>
      `;
      html += owned.map((b) => {
        const count = recipes.filter(r => String(r.ISBN) === String(b.ISBN)).length;
        const color = bookColor(b.ISBN);
        return `
          <div class="book-tile pressable" style="background:${color};" onclick="selectBook('${b.ISBN}')">
            <div>
              <div class="book-tile-title">${escapeHtml(b.Title)}</div>
              <div class="book-tile-sub">${escapeHtml(b.Author||'')}</div>
            </div>
            <div class="book-tile-count">${count} recipe${count===1?'':'s'}</div>
          </div>
        `;
      }).join('');
      html += `<div class="book-tile add-tile pressable" onclick="openBookModal()">+ Add<br>cookbook</div>`;
      wrap.innerHTML = html;
    } else {
      const wishlist = books.filter(b => isTrue(b.Wishlist));
      let html = wishlist.map((b) => {
        const color = bookColor(b.ISBN);
        return `
          <div class="book-tile pressable" style="background:${color};" onclick="openBookModal('${b.ISBN}')">
            <div>
              <div class="book-tile-title">${escapeHtml(b.Title)}</div>
              <div class="book-tile-sub">${escapeHtml(b.Author||'')}</div>
            </div>
            <div class="book-tile-count">🛒 wishlist</div>
          </div>
        `;
      }).join('');
      html += `<div class="book-tile add-tile pressable" onclick="openBookModal(null, true)">+ Add to<br>wishlist</div>`;
      wrap.innerHTML = html;
    }
  }

  function clearSearch(){
    searchTerm = '';
    document.getElementById('searchInput').value = '';
    renderBooksTab();
  }

  function selectBook(isbn){ currentISBN = isbn; expandedRecipe = null; renderBooksTab(); }
  function toggleExpand(id){ expandedRecipe = expandedRecipe === id ? null : id; renderBooksTab(); }

  async function toggleFavorite(e, recipeId){
    e.stopPropagation();
    const recipe = recipeById(recipeId);
    if(!recipe) return;
    const newVal = !isTrue(recipe.IsFavorite);
    const {error} = await sb.from(T_RECIPE).update({IsFavorite:newVal}).eq('RecipeID', recipeId);
    if(error){ toast('Could not update favorite: ' + error.message, true); return; }
    await loadAll();
  }

  function renderCardBody(recipeId){
    const el = document.getElementById(`body-${recipeId}`);
    if(!el) return;
    const cooked = cookedByRecipe[recipeId] || [];
    let logHtml = cooked.length === 0
      ? `<div class="no-log">not cooked yet</div>`
      : `<div class="cooked-log">` + cooked.map(c => `
          <div class="cooked-entry">
            <div class="left"><span class="date">${escapeHtml(c.DateCooked||'')}</span>${escapeHtml(c.Comments||'')} ${againBadgeHtml(c.CookAgain)}</div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="mono" style="font-weight:700; color:var(--green);">${formatRating(c.Rating)}</span>
              <button class="btn small" onclick="openCookedModal(${c.CookedID})">Edit</button>
              <button class="btn small danger" onclick="deleteCooked(${c.CookedID}, ${recipeId})">✕</button>
            </div>
          </div>
        `).join('') + `</div>`;

    el.innerHTML = `
      ${logHtml}
      <div class="inline-form">
        <input type="date" id="newDate-${recipeId}" min="${MIN_DATE}" max="${todayStr()}">
        <input type="number" step="0.1" min="0" max="10" placeholder="rating" id="newRating-${recipeId}" style="width:80px;">
        <input type="text" placeholder="comments" id="newComments-${recipeId}" style="flex:1; min-width:120px;">
      </div>
      <div class="inline-form">
        <span class="mono" style="font-size:11px; color:var(--muted);">cook again?</span>
        <div class="again-toggle" id="newAgain-${recipeId}">
          <button type="button" class="again-btn yes" onclick="setAgainToggle('newAgain-${recipeId}', true)">👍</button>
          <button type="button" class="again-btn no" onclick="setAgainToggle('newAgain-${recipeId}', false)">👎</button>
        </div>
        <button class="btn green small" onclick="addCooked(${recipeId})">Log</button>
      </div>
      <div class="row-actions">
        <button class="btn small" onclick="openRecipeModal(${recipeId})">Edit recipe</button>
        <button class="btn small danger" onclick="deleteRecipe(${recipeId})">Delete recipe</button>
      </div>
    `;
  }

  // ---------------- COOKED TAB ----------------
  function renderCookedTab(){
    const wrap = document.getElementById('cookedFullList');
    const empty = document.getElementById('cookedEmpty');
    if(cookedAll.length === 0){ wrap.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display = 'none';
    wrap.innerHTML = cookedAll.map(c => {
      const recipe = recipeById(c.RecipeID);
      const book = recipe ? bookById(recipe.ISBN) : null;
      return `
        <div class="cooked-full-item">
          <div class="cooked-full-top">
            <div>
              <div class="name">${escapeHtml(recipe ? recipe.RecipeName : 'Unknown recipe')}</div>
              <div class="book">${escapeHtml(book ? book.Title : '')}</div>
            </div>
            <div class="rating-chip" style="background:${bookColor(book?.ISBN)}; color:#fff;">${formatRating(c.Rating)}</div>
          </div>
          ${c.Comments ? `<div class="cooked-full-comment">${escapeHtml(c.Comments)}</div>` : ''}
          <div class="cooked-full-bottom">
            <span class="date">${escapeHtml(c.DateCooked||'')} ${againBadgeHtml(c.CookAgain)}</span>
            <div style="display:flex; gap:6px;">
              <button class="btn small" onclick="openCookedModal(${c.CookedID})">Edit</button>
              <button class="btn small danger" onclick="deleteCooked(${c.CookedID}, ${c.RecipeID})">Remove</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function openCookedModal(cookedId){
    const entry = cookedId ? cookedAll.find(c => String(c.CookedID) === String(cookedId)) : null;
    document.getElementById('cookedModalTitle').textContent = entry ? 'Edit cook' : 'Log a cook';
    document.getElementById('cookedOriginalID').value = cookedId || '';

    const sel = document.getElementById('cookedRecipeSelect');
    sel.innerHTML = recipes.map(r => `<option value="${r.RecipeID}">${escapeHtml(r.RecipeName)}</option>`).join('');
    sel.disabled = !!entry;
    if(entry) sel.value = entry.RecipeID;

    const dateInput = document.getElementById('cookedDate');
    dateInput.min = MIN_DATE;
    dateInput.max = todayStr();
    dateInput.value = entry ? entry.DateCooked : todayStr();
    document.getElementById('cookedRating').value = entry ? (entry.Rating ?? '') : '';
    document.getElementById('cookedComments').value = entry ? (entry.Comments || '') : '';

    document.getElementById('cookedAgainToggle').querySelectorAll('.again-btn').forEach(b => b.classList.remove('on'));
    if(entry && (entry.CookAgain === true || entry.CookAgain === false || isTrue(entry.CookAgain) || isFalseSet(entry.CookAgain))){
      setAgainToggle('cookedAgainToggle', isTrue(entry.CookAgain));
    } else {
      delete againState['cookedAgainToggle'];
    }
    document.getElementById('cookedOverlay').classList.add('open');
  }

  async function saveStandaloneCooked(){
    const originalId = document.getElementById('cookedOriginalID').value;
    const recipeId = document.getElementById('cookedRecipeSelect').value;
    const date = document.getElementById('cookedDate').value;
    const comments = document.getElementById('cookedComments').value.trim();
    if(!recipeId || !date){ toast('Pick a recipe and a date.', true); return; }
    if(date > todayStr()){ toast('Cook date can\'t be in the future.', true); return; }
    if(date < MIN_DATE){ toast('Cook date can\'t be before Jan 2026.', true); return; }
    const rating = validateRating(document.getElementById('cookedRating').value);
    if(rating === false) return;
    const again = 'cookedAgainToggle' in againState ? againState['cookedAgainToggle'] : null;

    let error;
    if(originalId){
      ({error} = await sb.from(T_COOKED).update({
        DateCooked: date, Comments: comments, Rating: rating ?? 0, CookAgain: again
      }).eq('CookedID', originalId));
    } else {
      ({error} = await sb.from(T_COOKED).insert({
        RecipeID: recipeId, DateCooked: date, Comments: comments, Rating: rating ?? 0, CookAgain: again
      }));
    }
    if(error){ toast('Could not save: ' + error.message, true); return; }
    closeModal('cookedOverlay');
    toast(originalId ? 'Updated!' : 'Logged!');
    await loadAll();
    switchTab(currentTab === 'books' ? 'books' : 'cooked');
  }

  // ---------------- Book CRUD ----------------
  function openBookModal(isbn, forceWishlist){
    document.getElementById('bookModalTitle').textContent = isbn ? 'Edit cookbook' : 'Add a cookbook';
    const book = isbn ? bookById(isbn) : null;
    document.getElementById('bookOriginalISBN').value = isbn || '';
    document.getElementById('bookISBN').value = book ? book.ISBN : '';
    document.getElementById('bookISBN').disabled = !!book;
    document.getElementById('bookTitle').value = book ? book.Title || '' : '';
    document.getElementById('bookAuthor').value = book ? book.Author || '' : '';
    document.getElementById('bookLocation').value = book ? book.Location || '' : '';
    document.getElementById('bookWishlist').checked = book ? isTrue(book.Wishlist) : !!forceWishlist;
    document.getElementById('bookOverlay').classList.add('open');
  }

  async function saveBook(){
    const original = document.getElementById('bookOriginalISBN').value;
    const isbn = document.getElementById('bookISBN').value.trim();
    const title = document.getElementById('bookTitle').value.trim();
    const author = document.getElementById('bookAuthor').value.trim();
    const location = document.getElementById('bookLocation').value.trim();
    const wishlist = document.getElementById('bookWishlist').checked;
    if(!isbn || !title){ toast('ISBN and title are required.', true); return; }
    let error;
    if(original){
      ({error} = await sb.from(T_BOOK).update({Title:title, Author:author, Location:location, Wishlist:wishlist}).eq('ISBN', original));
    } else {
      ({error} = await sb.from(T_BOOK).insert({ISBN:isbn, Title:title, Author:author, Location:location, Wishlist:wishlist}));
    }
    if(error){ toast('Could not save book: ' + error.message, true); return; }
    closeModal('bookOverlay');
    toast('Cookbook saved!');
    await loadAll();
  }

  async function deleteBook(isbn){
    if(recipes.some(r => String(r.ISBN) === String(isbn))){
      toast('This book still has recipes attached. Delete those first.', true);
      return;
    }
    if(!confirm('Delete this cookbook?')) return;
    const {error} = await sb.from(T_BOOK).delete().eq('ISBN', isbn);
    if(error){ toast('Could not delete: ' + error.message, true); return; }
    currentISBN = 'all';
    toast('Cookbook removed.');
    await loadAll();
  }

  // ---------------- Recipe CRUD ----------------
  function openRecipeModal(recipeId){
    document.getElementById('recipeModalTitle').textContent = recipeId ? 'Edit recipe' : 'Add a recipe';
    const recipe = recipeId ? recipeById(recipeId) : null;
    document.getElementById('recipeOriginalID').value = recipeId || '';
    document.getElementById('recipeName').value = recipe ? recipe.RecipeName || '' : '';
    document.getElementById('recipePage').value = recipe ? recipe.Page || '' : '';
    document.getElementById('recipeTags').value = recipe ? recipe.Tags || '' : '';
    document.getElementById('recipeFavorite').checked = recipe ? isTrue(recipe.IsFavorite) : false;
    const select = document.getElementById('recipeBook');
    select.innerHTML = books.filter(b=>!isTrue(b.Wishlist)).map(b => `<option value="${b.ISBN}">${escapeHtml(b.Title)}</option>`).join('');
    const preselect = recipe ? recipe.ISBN : ((currentISBN !== 'all' && currentISBN !== 'ALL' && currentISBN !== 'FAV') ? currentISBN : (books.find(b=>!isTrue(b.Wishlist))?.ISBN));
    if(preselect) select.value = preselect;
    document.getElementById('recipeOverlay').classList.add('open');
  }

  async function saveRecipe(){
    const original = document.getElementById('recipeOriginalID').value;
    const name = document.getElementById('recipeName').value.trim();
    const isbn = document.getElementById('recipeBook').value;
    const page = document.getElementById('recipePage').value.trim();
    const tags = document.getElementById('recipeTags').value.trim();
    const favorite = document.getElementById('recipeFavorite').checked;
    if(!name || !isbn){ toast('Recipe name and cookbook are required.', true); return; }
    let error;
    if(original){
      ({error} = await sb.from(T_RECIPE).update({RecipeName:name, ISBN:isbn, Page:page || null, Tags: tags || null, IsFavorite: favorite}).eq('RecipeID', original));
    } else {
      ({error} = await sb.from(T_RECIPE).insert({RecipeName:name, ISBN:isbn, Page:page || null, Tags: tags || null, IsFavorite: favorite}));
    }
    if(error){ toast('Could not save recipe: ' + error.message, true); return; }
    closeModal('recipeOverlay');
    toast('Recipe saved!');
    await loadAll();
  }

  async function deleteRecipe(recipeId){
    if(!confirm('Delete this recipe? Its cooked log will be removed too.')) return;
    await sb.from(T_COOKED).delete().eq('RecipeID', recipeId);
    const {error} = await sb.from(T_RECIPE).delete().eq('RecipeID', recipeId);
    if(error){ toast('Could not delete: ' + error.message, true); return; }
    expandedRecipe = null;
    toast('Recipe removed.');
    await loadAll();
  }

  // ---------------- Cooked CRUD (inline) ----------------
  async function addCooked(recipeId){
    const date = document.getElementById(`newDate-${recipeId}`).value;
    const comments = document.getElementById(`newComments-${recipeId}`).value.trim();
    if(!date){ toast('Pick a date cooked.', true); return; }
    if(date > todayStr()){ toast('Cook date can\'t be in the future.', true); return; }
    if(date < MIN_DATE){ toast('Cook date can\'t be before Jan 2026.', true); return; }
    const rating = validateRating(document.getElementById(`newRating-${recipeId}`).value);
    if(rating === false) return;
    const toggleId = `newAgain-${recipeId}`;
    const again = toggleId in againState ? againState[toggleId] : null;
    const {error} = await sb.from(T_COOKED).insert({RecipeID:recipeId, DateCooked:date, Comments:comments, Rating: rating ?? 0, CookAgain: again});
    if(error){ toast('Could not log: ' + error.message, true); return; }
    delete againState[toggleId];
    toast('Logged!');
    await loadAll();
    expandedRecipe = recipeId;
    switchTab('books');
  }

  async function deleteCooked(cookedId, recipeId){
    if(!confirm('Remove this log entry?')) return;
    const {error} = await sb.from(T_COOKED).delete().eq('CookedID', cookedId);
    if(error){ toast('Could not delete: ' + error.message, true); return; }
    const wasTab = currentTab;
    await loadAll();
    expandedRecipe = recipeId;
    switchTab(wasTab);
  }

  // ---------------- STATS TAB ----------------
  function renderStats(){
    const wrap = document.getElementById('statsBody');
    if(recipes.length === 0){
      wrap.innerHTML = `<div class="empty-msg">add some recipes and cook a few to see stats here!</div>`;
      return;
    }

    const neverCooked = recipes.filter(r => !(cookedByRecipe[r.RecipeID]||[]).length).length;

    // most cooked / top rated recipe
    let mostCookedRecipe = null, mostCookedCount = 0;
    let topRatedRecipe = null, topRatedAvg = -1;
    recipes.forEach(r => {
      const c = cookedByRecipe[r.RecipeID] || [];
      if(c.length > mostCookedCount){ mostCookedCount = c.length; mostCookedRecipe = r; }
      const avg = ratingAvg(c);
      if(avg !== null && avg > topRatedAvg){ topRatedAvg = avg; topRatedRecipe = r; }
    });

    // per-book aggregates
    const bookAgg = {};
    cookedAll.forEach(c => {
      const recipe = recipeById(c.RecipeID);
      if(!recipe) return;
      const isbn = recipe.ISBN;
      if(!bookAgg[isbn]) bookAgg[isbn] = {count:0, ratingSum:0, ratingCount:0};
      bookAgg[isbn].count++;
      if(c.Rating !== null && c.Rating !== undefined){ bookAgg[isbn].ratingSum += Number(c.Rating)||0; bookAgg[isbn].ratingCount++; }
    });
    let mostCookedBook = null, mostCookedBookCount = 0;
    let topRatedBook = null, topRatedBookAvg = -1;
    Object.keys(bookAgg).forEach(isbn => {
      const agg = bookAgg[isbn];
      if(agg.count > mostCookedBookCount){ mostCookedBookCount = agg.count; mostCookedBook = bookById(isbn); }
      if(agg.ratingCount > 0){
        const avg = agg.ratingSum / agg.ratingCount;
        if(avg > topRatedBookAvg){ topRatedBookAvg = avg; topRatedBook = bookById(isbn); }
      }
    });

    const yesCount = cookedAll.filter(c => isTrue(c.CookAgain)).length;
    const noCount = cookedAll.filter(c => isFalseSet(c.CookAgain)).length;
    const answered = yesCount + noCount;
    const pct = answered ? Math.round((yesCount/answered)*100) : null;

    function row(emoji, title, sub, chip){
      return `
        <div class="recent-item">
          <div>
            <div class="name">${emoji} ${escapeHtml(title)}</div>
            <div class="sub">${escapeHtml(sub)}</div>
          </div>
          ${chip ? `<div class="rating-chip">${escapeHtml(chip)}</div>` : ''}
        </div>
      `;
    }

    let html = `
      <div class="stats-row" style="grid-template-columns:repeat(2,1fr); margin-bottom:22px;">
        <div class="stat-card plain"><div class="num">${cookedAll.length}</div><div class="label">meals logged</div></div>
        <div class="stat-card plain"><div class="num">${neverCooked}</div><div class="label">never cooked</div></div>
      </div>
      <div class="section-title" style="margin-top:0;">Hall of fame</div>
    `;
    html += mostCookedRecipe
      ? row('🔥', mostCookedRecipe.RecipeName, 'most-cooked recipe', `${mostCookedCount}×`)
      : `<div class="empty-msg">cook something to unlock this</div>`;
    html += topRatedRecipe
      ? row('🏅', topRatedRecipe.RecipeName, 'top-rated recipe', `${topRatedAvg.toFixed(1)}/10`)
      : '';
    html += mostCookedBook
      ? row('📖', mostCookedBook.Title, 'most-cooked book', `${mostCookedBookCount}×`)
      : '';
    html += topRatedBook
      ? row('🌟', topRatedBook.Title, 'top-rated book', `${topRatedBookAvg.toFixed(1)}/10`)
      : '';

    html += `<div class="section-title">Would you cook it again?</div>`;
    html += pct !== null
      ? `<div class="empty-msg" style="background:var(--card); color:var(--text);">👍 ${pct}% yes (${yesCount} of ${answered} answered)</div>`
      : `<div class="empty-msg">start answering "cook again?" to see this</div>`;

    wrap.innerHTML = html;
  }

  // ---------------- Helpers ----------------
  function closeModal(id){ document.getElementById(id).classList.remove('open'); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function formatRating(val){
    if(val === null || val === undefined || val === '') return '–';
    return `${val}/10`;
  }

  function validateRating(raw){
    if(raw === '' || raw === null || raw === undefined) return null;
    const n = Number(raw);
    if(isNaN(n) || n < 0 || n > 10){
      toast('Rating has to be between 0.0 and 10.0.', true);
      return false;
    }
    return n;
  }

  function setAgainToggle(toggleId, value){
    againState[toggleId] = value;
    const wrap = document.getElementById(toggleId);
    if(!wrap) return;
    wrap.querySelectorAll('.again-btn').forEach(b => b.classList.remove('on'));
    const btn = wrap.querySelector(value ? '.again-btn.yes' : '.again-btn.no');
    if(btn) btn.classList.add('on');
  }

  function againBadgeHtml(val){
    if(isTrue(val)) return `<span class="again-badge yes">👍 again</span>`;
    if(isFalseSet(val)) return `<span class="again-badge no">👎 skip</span>`;
    return '';
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderBooksTab();
  });
  document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('click', (e) => { if(e.target === ov) ov.classList.remove('open'); });
  });

  loadAll();
</script>
</body>
</html>
